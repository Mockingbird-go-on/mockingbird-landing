name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs-src/package-lock.json
            articles-src/package-lock.json

      - name: Build docs
        working-directory: docs-src
        run: |
          npm ci
          npm run build

      - name: Build articles
        working-directory: articles-src
        run: |
          npm ci
          npm run build

      - name: Commit built output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs articles
          if git diff --staged --quiet; then
            echo "No changes in docs/ or articles/"
          else
            git commit -m "docs: rebuild [skip ci]"
            git push
          fi

      - name: Stage site (whitelist)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for item in index.html assets robots.txt llms.txt sitemap.xml landing-sitemap.xml CNAME .nojekyll docs articles; do
            if [ -e "$item" ]; then
              cp -r "$item" _site/
            fi
          done
          echo "Staged:"
          find _site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
