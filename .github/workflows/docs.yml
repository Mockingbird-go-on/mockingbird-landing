name: Build docs & articles

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - "articles-src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs-src/package-lock.json
            articles-src/package-lock.json

      - name: Build docs
        working-directory: docs-src
        run: |
          npm ci
          npm run build

      - name: Build articles
        working-directory: articles-src
        run: |
          npm ci
          npm run build

      - name: Commit built output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs articles
          if git diff --staged --quiet; then
            echo "No changes in docs/ or articles/"
          else
            git commit -m "docs: rebuild [skip ci]"
            git push
          fi
